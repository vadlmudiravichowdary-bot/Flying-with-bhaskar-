<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flying Friends - Real Photo</title>
<style>
 body{margin:0;background:#0b1026;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:white;font-family:sans-serif}
 canvas{background:linear-gradient(#0b1026,#1e3c72);border-radius:20px;max-width:95vw;max-height:68vh;box-shadow:0 10px 30px rgba(0,0,0,.6)}
 h1{color:#ffde59;margin:8px;text-shadow:0 2px 0 #000}
 #score{font-size:20px;font-weight:bold}
 button{margin-top:10px;padding:10px 18px;border:none;border-radius:10px;background:#ffde59;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>✨ Flying Friends ✨</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="650"></canvas>
<div style="opacity:.8;font-size:13px;margin-top:6px">Tap / Space to Fly!</div>
<button onclick="location.reload()">Restart</button>
<img id="friendImg" src="friend.jpg" style="display:none">
<audio id="outSound" src="out.mp4" preload="auto"></audio>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const img=document.getElementById('friendImg');
let bird={x:90,y:320,vy:0,r:36},gravity=0.48,jump=-9,pipes=[],score=0,gameOver=false,frame=0;
function addPipe(){let topH=Math.random()*280+60;pipes.push({x:canvas.width,top:topH,gap:170,passed:false})}
canvas.addEventListener('touchstart',e=>{e.preventDefault();bird.vy=jump});
canvas.addEventListener('mousedown',()=>bird.vy=jump);
document.addEventListener('keydown',e=>{if(e.code==='Space'){bird.vy=jump;e.preventDefault()}});
function playOutSound(){
  const s=document.getElementById('outSound');
  if(s){ s.currentTime=0; s.play().catch(()=>{}); }
}
function drawBird(){
 ctx.save();
 ctx.beginPath(); ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2); ctx.clip();
 ctx.drawImage(img, 0,0, img.width, img.height, bird.x-bird.r, bird.y-bird.r, bird.r*2, bird.r*2);
 ctx.restore();
 ctx.strokeStyle='#ffde59'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2); ctx.stroke();
}
function loop(){
 if(gameOver)return;frame++;
 let grad=ctx.createLinearGradient(0,0,0,canvas.height); grad.addColorStop(0,'#0b1026'); grad.addColorStop(1,'#1e3c72');
 ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#fff9c4'; ctx.beginPath(); ctx.arc(340,70,32,0,Math.PI*2); ctx.fill();
 ctx.fillStyle='white';
 for(let i=0;i<40;i++){ let sx=(i*71+frame*0.4)%400; let sy=(i*47)%650; ctx.globalAlpha=0.5; ctx.fillRect(sx,sy,2,2);} ctx.globalAlpha=1;
 if(frame%95===0) addPipe();
 pipes.forEach(p=>{
  p.x-=3.2;
  ctx.fillStyle='#27ae60'; ctx.fillRect(p.x,0,62,p.top); ctx.fillRect(p.x,p.top+p.gap,62,650);
  if(bird.x+bird.r>p.x && bird.x-bird.r<p.x+62){ if(bird.y-bird.r<p.top || bird.y+bird.r>p.top+p.gap){ if(!gameOver) playOutSound(); gameOver=true; } }
  if(!p.passed && p.x+62<bird.x){p.passed=true;score++;document.getElementById('score').innerText='Score: '+score;}
 });
 pipes=pipes.filter(p=>p.x>-62);
 bird.vy+=gravity; bird.y+=bird.vy;
 if(bird.y+bird.r>650 || bird.y-bird.r<0){ if(!gameOver) playOutSound(); gameOver=true; }
 drawBird();
 if(gameOver){ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,400,650);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 34px sans-serif';ctx.fillText('Game Over!',200,300);ctx.font='20px sans-serif';ctx.fillText('Score: '+score,200,335);return;}
 requestAnimationFrame(loop);
}
img.onload=()=>loop();
if(img.complete) loop();
</script>
</body>
</html>
