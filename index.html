<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flying With Bhaskar</title>
<style>
body{margin:0;background:skyblue;overflow:hidden;font-family:Arial;touch-action:none}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(#87CEEB,#90EE90)}
#player{width:50px;height:50px;background:radial-gradient(yellow,orange);border-radius:50%;position:absolute;left:25%;border:3px solid red;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:5;box-shadow:0 0 10px gold}
.pipe{width:70px;background:linear-gradient(#2ecc71,#145a32);position:absolute;border:3px solid #000;border-radius:10px}
#score{position:fixed;top:15px;left:50%;transform:translateX(-50%);font-size:40px;font-weight:bold;color:white;text-shadow:3px 3px 0 black;z-index:10}
#start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(gold,orange);color:black;padding:25px 45px;border-radius:25px;font-weight:bold;text-align:center;z-index:20;border:4px solid white;box-shadow:0 0 20px black}
</style>
