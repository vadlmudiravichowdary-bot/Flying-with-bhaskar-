<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const img=document.getElementById('friendImg');
const outV=document.getElementById('outSound');
let audioUnlocked=false;
function unlockAudio(){if(!audioUnlocked){outV.play().then(()=>{outV.pause();outV.currentTime=0;audioUnlocked=true;}).catch(()=>{});}}
let bird={x:90,y:320,vy:0,r:30},gravity=0.32,jump=-7.2,pipes=[],score=0,gameOver=false,frame=0;
function addPipe(){let topH=Math.random()*200+60;pipes.push({x:canvas.width,top:topH,gap:220,passed:false})}
function jumpAction(){unlockAudio();bird.vy=jump;}
canvas.addEventListener('touchstart',e=>{e.preventDefault();jumpAction()},{passive:false});
canvas.addEventListener('mousedown',jumpAction);
document.addEventListener('keydown',e=>{if(e.code==='Space'){jumpAction();e.preventDefault()}});
document.addEventListener('click',unlockAudio,{once:true});
function playOut(){try{outV.currentTime=0;outV.muted=false;outV.volume=1;outV.play().catch(()=>{});}catch(e){}}
function drawBird(){
 ctx.save();ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);ctx.clip();
 if(img.complete&&img.naturalWidth>0){ctx.drawImage(img,bird.x-bird.r,bird.y-bird.r,bird.r*2,bird.r*2);}
 else{ctx.fillStyle='#ffde59';ctx.fillRect(bird.x-bird.r,bird.y-bird.r,bird.r*2,bird.r*2);}
 ctx.restore();ctx.strokeStyle='#ffde59';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);ctx.stroke();
}
function loop(){
 if(gameOver)return;frame++;
 let grad=ctx.createLinearGradient(0,0,0,canvas.height);grad.addColorStop(0,'#0b1026');grad.addColorStop(1,'#1e3c72');ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#fff9c4';ctx.beginPath();ctx.arc(340,70,28,0,Math.PI*2);ctx.fill();
 if(frame%140===0)addPipe();
 pipes.forEach(p=>{
  p.x-=2.0;ctx.fillStyle='#27ae60';ctx.fillRect(p.x,0,62,p.top);ctx.fillRect(p.x,p.top+p.gap,62,650);
  ctx.fillStyle='#145a32';ctx.fillRect(p.x-3,p.top-15,68,15);ctx.fillRect(p.x-3,p.top+p.gap,68,15);
  if(bird.x+bird.r>p.x+10&&bird.x-bird.r<p.x+52){if(bird.y-bird.r<p.top+5||bird.y+bird.r>p.top+p.gap-5){if(!gameOver)playOut();gameOver=true;}}
  if(!p.passed&&p.x+62<bird.x){p.passed=true;score++;document.getElementById('score').innerText='Score: '+score;}
 });
 pipes=pipes.filter(p=>p.x>-70);
 bird.vy+=gravity;bird.y+=bird.vy;
 if(bird.y+bird.r>650||bird.y-bird.r<0){if(!gameOver)playOut();gameOver=true;}
 drawBird();
 if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,400,650);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 32px sans-serif';ctx.fillText('Out Ayindhi!',200,300);ctx.font='20px sans-serif';ctx.fillText('Score: '+score,200,335);return;}
 requestAnimationFrame(loop);
}
loop();
   </script>
